name: WAV input bridge (non-release)
on:
  pull_request:
    branches: [main, 'develop/wav-import-v0.1.0', 'research/p005-bank-only-project-state-20261118', 'develop/p006-self-contained-resources-20261118', 'develop/p007-max-sample-duration-20261118', 'develop/p008-safe-wav-import-20261118', 'develop/p010-eii-project-bank-recall-20261118', 'develop/p011-firmware-safe-wav-cancel-20261118', 'develop/p012-eii-hdd-media-safety-20261118', 'develop/p013-verified-live-bank-snapshot-20261118', 'develop/p014-host-project-transaction-safety-20261118']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-wav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Check pinned upstream and patch anchors
        run: python3 tools/apply-wav-bridge.py --verify
      - name: Apply deterministic local WAV menu integration
        run: |
          python3 tools/apply-wav-bridge.py
          test -f upstream/eii-emu/src/125a_wav_input.h
          python3 tools/apply-wav-auto.py --verify
          python3 tools/apply-wav-auto.py
          python3 tools/apply-project-state.py --verify
          python3 tools/apply-project-state.py
          python3 tools/apply-bundled-resources.py --verify
          python3 tools/apply-bundled-resources.py
          python3 tools/apply-ux-safety.py --verify
          python3 tools/apply-ux-safety.py
          python3 tools/apply-p010-bank-recall.py --verify
          python3 tools/apply-p010-bank-recall.py
          python3 tools/apply-p011-firmware-cancel.py --verify
          python3 tools/apply-p011-firmware-cancel.py
          python3 tools/apply-p012-media-safety.py --verify
          python3 tools/apply-p012-media-safety.py
          python3 tools/apply-p013-live-bank-snapshot.py --verify
          python3 tools/apply-p013-live-bank-snapshot.py
          python3 tools/apply-p014-host-save-safety.py --verify
          python3 tools/apply-p014-host-save-safety.py
          python3 tests/p008_source_acceptance.py
          python3 tests/p010_source_acceptance.py
          python3 tests/p011_source_acceptance.py
          python3 tests/p012_source_acceptance.py
          python3 tests/p013_source_acceptance.py
          python3 tests/p014_source_acceptance.py
          grep -Fq 'projectBankSnapshot()' upstream/eii-emu/src/vst3/plugin_engine.h
          grep -Fq 'e.autoImportWav(std::move(source))' upstream/eii-emu/src/vst3/plugin_editor.h
          grep -Fq 'wavStep();' upstream/eii-emu/src/vst3/plugin_engine.h
      - name: Test immutable selected .EII project-bank snapshot
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -pedantic -I src tests/selected_bank_tests.cpp -o /tmp/selected_bank_tests
          /tmp/selected_bank_tests
      - name: Test original firmware STOP/EXIT cancellation FSM
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -pedantic -I src tests/firmware_cancel_tests.cpp -o /tmp/firmware_cancel_tests
          /tmp/firmware_cancel_tests
      - name: Test strict original EII bank size and blank HDD detection
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -Wno-error=misleading-indentation -pedantic -I src -I upstream/eii-emu/src tests/p012_media_safety_tests.cpp -o /tmp/p012_media_safety_tests
          /tmp/p012_media_safety_tests
      - name: Assert persistent unfinished-bank marker and CRC-safe bank restore
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -Wno-error=misleading-indentation -pedantic -I upstream/eii-emu/src -I upstream/eii-emu/vendor/chips tests/p014_project_save_tests.cpp -o /tmp/p014_project_save_tests
          /tmp/p014_project_save_tests
      - name: Compile bundled ROM/OS path regression
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -Wno-error=misleading-indentation -pedantic -I src -I upstream/eii-emu/src -I upstream/eii-emu/vendor/chips tests/bundled_resources_tests.cpp -o /tmp/bundled_resources_tests
      - name: Verify private ROM/OS bundle discovery and moved-project path repairs
        run: /tmp/bundled_resources_tests
      - name: Compile native C++23 WAV-to-SAR-input tests
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -pedantic -I src -I upstream/eii-emu/src tests/wav_input_tests.cpp -o /tmp/wav_input_tests
      - name: Test positive, negative and firmware-input activation cases
        run: /tmp/wav_input_tests
      - name: Compile original firmware contact controller test
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -pedantic -I src tests/wav_firmware_controller_tests.cpp -o /tmp/wav_firmware_controller_tests
      - name: Verify normal, timeouts, overload, insufficient RAM and cancel gates
        run: /tmp/wav_firmware_controller_tests
      - name: Compile original firmware DISK7 SAVE BANK control-state tests
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -pedantic -I src tests/bank_save_controller_tests.cpp -o /tmp/bank_save_tests
      - name: Verify exact panel flow and incomplete/corrupt saving gates
        run: /tmp/bank_save_tests
      - name: Compile P004 original-bank project codec
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -pedantic -I src tests/portable_state_tests.cpp -o /tmp/portable_state_tests
      - name: Assert full original-bank round-trip and fail-closed legacy/corrupt-state cases
        run: /tmp/portable_state_tests
      - name: Compile original EII SAR/Z80/DRAM integration
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -Wno-error=misleading-indentation -pthread -I src -I upstream/eii-emu/src -I upstream/eii-emu/vendor/chips upstream/eii-emu/src/chips.cpp upstream/eii-emu/src/machine.cpp upstream/eii-emu/vendor/ssm2045-chip/src/chip.cpp tests/wav_sar_machine_tests.cpp -o /tmp/wav_sar_machine_tests
      - name: Assert real SAR/DRAM PCM against silence negative control
        run: /tmp/wav_sar_machine_tests

  windows-vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Verify and apply source-pinned bridge
        shell: pwsh
        run: |
          python tools/apply-wav-bridge.py --verify
          if ($LASTEXITCODE -ne 0) { throw "Bridge preflight failed" }
          python tools/apply-wav-bridge.py
          if ($LASTEXITCODE -ne 0) { throw "Bridge application failed" }
          python tools/apply-wav-auto.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P003 preflight failed" }
          python tools/apply-wav-auto.py
          if ($LASTEXITCODE -ne 0) { throw "P003 application failed" }
          python tools/apply-project-state.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P004 preflight failed" }
          python tools/apply-project-state.py
          if ($LASTEXITCODE -ne 0) { throw "P004 application failed" }
          python tools/apply-bundled-resources.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P006 resource preflight failed" }
          python tools/apply-bundled-resources.py
          if ($LASTEXITCODE -ne 0) { throw "P006 resource patch failed" }
          python tools/apply-ux-safety.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P008 safety preflight failed" }
          python tools/apply-ux-safety.py
          if ($LASTEXITCODE -ne 0) { throw "P008 safety application failed" }
          python tools/apply-p010-bank-recall.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P010 preflight failed" }
          python tools/apply-p010-bank-recall.py
          if ($LASTEXITCODE -ne 0) { throw "P010 overlay failed" }
          python tools/apply-p011-firmware-cancel.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P011 preflight failed" }
          python tools/apply-p011-firmware-cancel.py
          if ($LASTEXITCODE -ne 0) { throw "P011 overlay failed" }
          python tools/apply-p012-media-safety.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P012 preflight failed" }
          python tools/apply-p012-media-safety.py
          if ($LASTEXITCODE -ne 0) { throw "P012 overlay failed" }
          python tools/apply-p013-live-bank-snapshot.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P013 preflight failed" }
          python tools/apply-p013-live-bank-snapshot.py
          if ($LASTEXITCODE -ne 0) { throw "P013 integration failed" }
          python tools/apply-p014-host-save-safety.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P014 preflight failed" }
          python tools/apply-p014-host-save-safety.py
          if ($LASTEXITCODE -ne 0) { throw "P014 integration failed" }
          python tests/p008_source_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw "P008 source integration acceptance failed" }
          python tests/p010_source_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw "P010 source integration acceptance failed" }
          python tests/p011_source_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw "P011 source integration acceptance failed" }
          python tests/p012_source_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw "P012 source integration acceptance failed" }
          python tests/p013_source_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw "P013 source integration acceptance failed" }
          python tests/p014_source_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw "P014 source integration acceptance failed" }
          python tools/apply-vst3-state-host-test.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P004 host test preflight failed" }
          python tools/apply-vst3-state-host-test.py
          if ($LASTEXITCODE -ne 0) { throw "P004 host test patch failed" }
          python tools/apply-p014-host-test.py --verify
          if ($LASTEXITCODE -ne 0) { throw "P014 host test preflight failed" }
          python tools/apply-p014-host-test.py
          if ($LASTEXITCODE -ne 0) { throw "P014 host test patch failed" }
      - name: Install pinned LLVM-MinGW 20261006 UCRT x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "llvm-mingw-ucrt.zip"
          $root = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          $compiler = Get-ChildItem -Path $root -Filter "x86_64-w64-mingw32-clang++.exe" -Recurse -File | Select-Object -First 1
          if (-not $compiler) { throw "Pinned LLVM-MinGW compiler not found" }
          $toolchain = Split-Path (Split-Path $compiler.FullName -Parent) -Parent
          "LLVM_MINGW_ROOT=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build real Windows Custom VST3 and upstream tests/Steinberg validator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "upstream/eii-emu/tools/build-win64-vst3.ps1" -ToolchainRoot $env:LLVM_MINGW_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Windows build/test failed" }
      - name: "Actual Windows VST3 host tests: project bank IBStream round-trip, corruption and isolation"
        shell: pwsh
        run: |
          $bundle="upstream/eii-emu/build/win64-vst3/EmulatorII-Custom.vst3"
          $probe="upstream/eii-emu/build/win64-vst3/vst3_host_test.exe"
          if (-not (Test-Path $probe)) { throw "VST3 host probe missing" }
          & $probe $bundle "unused" "unused" "unused" "project-state"
          if ($LASTEXITCODE -ne 0) { throw "Real COM VST3 project bank state roundtrip failed" }
      - name: Verify installable bundle and no included private media
        shell: pwsh
        run: |
          $root="upstream/eii-emu/build/win64-vst3"
          $bundle=Join-Path $root "EmulatorII-Custom.vst3"
          $dll=Join-Path $bundle "Contents/x86_64-win/EmulatorII-Custom.vst3"
          if (-not (Test-Path $dll)) { throw "Missing VST3 binary" }
          if ((Get-Item $dll).Length -lt 100000) { throw "Unexpectedly small VST3" }
          $private=Get-ChildItem $bundle -File -Recurse | Where-Object {$_.Extension -in @('.bin','.hfe','.emuiifd','.eii','.img')}
          if ($private) { throw "No licensed ROM/media may enter public package" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $bundle -Destination artifact -Recurse
          Copy-Item 'QA/START-HERE-P014.md' 'artifact/START-HERE.md'
          Copy-Item 'LICENSE' 'artifact/GPL-3.0-LICENSE.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: P014-125A-EmulatorII-Windows-x64-VST3-DEV-NOT-FINAL
          path: artifact/
          if-no-files-found: error
          retention-days: 5
