      - name: Install pinned LLVM-MinGW 20261006 UCRT x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "llvm-mingw-ucrt.zip"
          $root = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          $compiler = Get-ChildItem -Path $root -Filter "x86_64-w64-mingw32-clang++.exe" -Recurse -File | Select-Object -First 1
          if (-not $compiler) { throw "Pinned LLVM-MinGW compiler not found" }
          $toolchain = Split-Path (Split-Path $compiler.FullName -Parent) -Parent
          "LLVM_MINGW_ROOT=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build real Windows Custom VST3 and upstream tests/Steinberg validator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "upstream/eii-emu/tools/build-win64-vst3.ps1" -ToolchainRoot $env:LLVM_MINGW_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Windows build/test failed" }
      - name: "Actual Windows VST3 host tests: project bank IBStream round-trip, corruption and isolation"
        shell: pwsh
        run: |
          $bundle="upstream/eii-emu/build/win64-vst3/EmulatorII-Custom.vst3"
          $probe="upstream/eii-emu/build/win64-vst3/vst3_host_test.exe"
          if (-not (Test-Path $probe)) { throw "VST3 host probe missing" }
          & $probe $bundle "unused" "unused" "unused" "project-state"
          if ($LASTEXITCODE -ne 0) { throw "Real COM VST3 project bank state roundtrip failed" }
      - name: Verify installable bundle and no included private media
        shell: pwsh
        run: |
          $root="upstream/eii-emu/build/win64-vst3"
          $bundle=Join-Path $root "EmulatorII-Custom.vst3"
          $dll=Join-Path $bundle "Contents/x86_64-win/EmulatorII-Custom.vst3"
          if (-not (Test-Path $dll)) { throw "Missing VST3 binary" }
          if ((Get-Item $dll).Length -lt 100000) { throw "Unexpectedly small VST3" }
          $private=Get-ChildItem $bundle -File -Recurse | Where-Object {$_.Extension -in @('.bin','.hfe','.emuiifd','.eii','.img')}
          if ($private) { throw "No licensed ROM/media may enter public package" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $bundle -Destination artifact -Recurse
          Copy-Item 'QA/START-HERE-P025.md' 'artifact/START-HERE.md'
          Copy-Item 'LICENSE' 'artifact/GPL-3.0-LICENSE.txt'
      - uses: actions/upload-artifact@v4
