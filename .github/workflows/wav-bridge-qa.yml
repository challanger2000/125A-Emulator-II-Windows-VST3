      - name: Install pinned LLVM-MinGW 20261006 UCRT x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "llvm-mingw-ucrt.zip"
          $root = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          $compiler = Get-ChildItem -Path $root -Filter "x86_64-w64-mingw32-clang++.exe" -Recurse -File | Select-Object -First 1
          if (-not $compiler) { throw "Pinned LLVM-MinGW compiler not found" }
          $toolchain = Split-Path (Split-Path $compiler.FullName -Parent) -Parent
          "LLVM_MINGW_ROOT=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: P036 run actual original Z80/SAR analog host input rate acceptance on Windows x64
        shell: pwsh
        run: |
          $cc=Join-Path $env:LLVM_MINGW_ROOT "bin/x86_64-w64-mingw32-clang++.exe"
          $args=@('-std=c++23','-O2','-Wall','-Wextra','-Werror','-Wno-error=misleading-indentation','-pthread','-static','-Iupstream/eii-emu/src','-Iupstream/eii-emu/vendor/chips','upstream/eii-emu/src/chips.cpp','upstream/eii-emu/src/machine.cpp','upstream/eii-emu/vendor/ssm2045-chip/src/chip.cpp','upstream/eii-emu/vendor/eiii-cem/eiii_cem3387_v2.cpp','upstream/eii-emu/vendor/eiii-cem/eiii_cem_cv_conditioning.cpp','tests/p036_original_host_sar_rates.cpp','-o','p036_original_sar_windows.exe')
          & $cc @args
          if ($LASTEXITCODE -ne 0) { throw "P036 Windows real original sample analog/SAR/Z80 integration compile failed" }
          & './p036_original_sar_windows.exe'
          if ($LASTEXITCODE -ne 0) { throw "P036 actual Windows original sample recording across DAW rates failed" }
