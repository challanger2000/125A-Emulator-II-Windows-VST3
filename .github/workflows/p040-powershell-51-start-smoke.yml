name: P040 Windows PowerShell 5.1 START smoke
on:
  pull_request:
    paths:
      - 'tools/Test-Private-Original-EII-P040-Windows.ps1'
      - 'tools/START-P040-TEST.bat'
      - '.github/workflows/p040-powershell-51-start-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell-start:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify script path defaults with Windows PowerShell 5.1 without private media
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=(Resolve-Path 'tools/Test-Private-Original-EII-P040-Windows.ps1').Path
          $root=(Resolve-Path '.').Path
          $bogus=Join-Path $root 'P040-NO-ROM-MUST-BLOCK'
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -RomDir $bogus -Os31Floppy (Join-Path $bogus 'os31.emuiifd') -ChoirFloppy (Join-Path $bogus 'choir.emuiifd') 2>&1 | Out-String
          $exit=$LASTEXITCODE
          Write-Host $output
          if($exit -eq 0) { throw 'P040 unexpectedly succeeded with no ROM or VST3' }
          if($output -notmatch 'P040 SCRIPT_DIR ') { throw 'P040 Windows PowerShell 5.1 script folder was not resolved' }
          if($output -notmatch 'P040 actual Windows VST3 COM test executable missing') { throw 'P040 expected missing-executable preflight, not an empty Path binding exception' }
          if($output -match 'ParameterArgumentValidationErrorEmptyStringNotAllowed') { throw 'Original P040 empty Path bug persists' }
          Write-Host 'P040 REAL WINDOWS POWERSHELL 5.1 SCRIPT PATH AND NO-ROM FAIL-CLOSED SMOKE: PASS'
          $global:LASTEXITCODE=0
      - name: Smoke the one-click CMD starter and live output logging
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:P040_CI='1'
          & cmd.exe /d /c 'call tools\START-P040-TEST.bat'
          $code=$LASTEXITCODE
          $path='tools/P040-TEST-ERGEBNIS.txt'
          if (!(Test-Path -LiteralPath $path)) { throw 'P040 batch failed to write result log' }
          $log=Get-Content -LiteralPath $path -Raw
          Write-Host ('Batch process exit code: '+$code)
          if ($code -eq 0) { throw 'P040 one-click batch falsely passed with no VST3' }
          if ($log -notmatch 'P040 SCRIPT_DIR ') { throw 'P040 batch did not pass script location' }
          if ($log -notmatch 'P040 actual Windows VST3 COM test executable missing') {
            throw 'P040 one-click batch never reached the expected no-media preflight'
          }
          if ($log -notmatch 'P040 BAT exit_code=') { throw 'P040 one-click batch exit status missing' }
          if ($log -match 'ParameterArgumentValidationErrorEmptyStringNotAllowed|Supply values for the following parameters') {
            throw 'P040 one-click batch has the old broken PowerShell argument handling'
          }
          Write-Host 'P040 START-P040-TEST.bat REAL WINDOWS CMD LIVE-LOGGING SMOKE: PASS'
          # CMD is expected to return failure for the deliberately absent VST3.
          # Clear the resulting LASTEXITCODE after all fail-closed assertions pass.
          $global:LASTEXITCODE=0
      - name: P041 real Windows CMD auto-discovery launcher smoke (no original ROM)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $scratch=Join-Path $env:RUNNER_TEMP 'P041-Launcher-Windows-Test'
          $kit=Join-Path $scratch 'P041-Current-Test'
          $old=Join-Path $scratch '125A-Emulator-II-P040-Test'
          New-Item -ItemType Directory -Force -Path $kit | Out-Null
          Copy-Item 'tools/START-P041-TEST.bat' (Join-Path $kit 'START-P041-TEST.bat')
          Copy-Item 'tools/P041-AutoLauncher.ps1' (Join-Path $kit 'P041-AutoLauncher.ps1')
          Copy-Item 'tools/Test-Private-Original-EII-P040-Windows.ps1' (Join-Path $kit 'Test-Private-Original-EII-P040-Windows.ps1')
          New-Item -ItemType File -Force -Path (Join-Path $kit 'vst3_host_test.exe') | Out-Null
          $vst=Join-Path $kit 'EmulatorII-Custom.vst3/Contents/x86_64-win'
          New-Item -ItemType Directory -Force -Path $vst | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $vst 'EmulatorII-Custom.vst3') | Out-Null
          $env:P041_CI='1'
          Push-Location $kit
          try {
            & cmd.exe /d /c 'call START-P041-TEST.bat'
            $negative=$LASTEXITCODE
            $log=Get-Content -LiteralPath 'P041-TEST-ERGEBNIS.txt' -Raw
            if ($negative -ne 3) { throw "P041 absent-media negative must exit 3, got $negative" }
            if ($log -notmatch 'Originalmedien nicht gefunden') {
              throw 'P041 absent-media negative did not print actionable result'
            }
            if ($log -match 'Supply values for the following parameters') {
              throw 'P041 launcher unexpectedly prompts for mandatory PowerShell args'
            }
          } finally { Pop-Location }
          # Synthetic launcher-only probe of media-location forwarding. The
          # executable and ROM files here are deliberately empty placeholders.
          # This step can NEVER count as genuine firmware or audio acceptance.
          $rom=Join-Path $old 'Original-ROM'
          $disk=Join-Path $old 'Original-Medien'
          New-Item -ItemType Directory -Force -Path $rom,$disk | Out-Null
          foreach ($f in @('main.bin','scanner.bin','ic135.bin','ic137.bin')) {
            New-Item -ItemType File -Force -Path (Join-Path $rom $f) | Out-Null
          }
          New-Item -ItemType File -Force -Path (Join-Path $disk 'Emulator-II-OS31.emuiifd') | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $disk 'EII-Choir.emuiifd') | Out-Null
          @'
          param([string]$RomDir,[string]$Os31Floppy,[string]$ChoirFloppy)
          if (!(Test-Path -LiteralPath (Join-Path $RomDir 'main.bin'))) {exit 7}
          if (!(Test-Path -LiteralPath $Os31Floppy)) {exit 8}
          if (!(Test-Path -LiteralPath $ChoirFloppy)) {exit 9}
          Write-Host 'P041 SYNTHETIC LAUNCHER ARGUMENTS ONLY: PASS (NO FIRMWARE BOOT)'
          exit 0
          '@ | Set-Content -LiteralPath (Join-Path $kit 'Test-Private-Original-EII-P040-Windows.ps1') -Encoding UTF8
          Push-Location $kit
          try {
            & cmd.exe /d /c 'call START-P041-TEST.bat'
            $positive=$LASTEXITCODE
            $log=Get-Content -LiteralPath 'P041-TEST-ERGEBNIS.txt' -Raw
            if ($positive -ne 0) { throw "P041 synthetic launcher argument proof failed: $positive" }
            if ($log -notmatch 'Vollstaendige Originalmedien in einem lokalen Testordner gefunden') {
              throw 'P041 did not automatically discover sibling prior-P040 private-media directory'
            }
            if ($log -notmatch 'P041 FINAL WINDOWS ORIGINAL FIRMWARE MATRIX: PASS') {
              throw 'P041 launcher did not preserve success exit code'
            }
          } finally { Pop-Location }
          # Previous media may now be in an arbitrarily renamed nested kit;
          # this is the exact owner's failure after P041 only checked a literal
          # folder name. The files are still synthetic zero-byte placeholders.
          $nested=Join-Path $scratch 'Renamed-Diagnostics'
          New-Item -ItemType Directory -Force -Path $nested | Out-Null
          Move-Item -LiteralPath $old -Destination (Join-Path $nested 'MyOld-P040-FIX2')
          Push-Location $kit
          try {
            & cmd.exe /d /c 'call START-P041-TEST.bat'
            $nestedCode=$LASTEXITCODE
            $nestedLog=Get-Content -LiteralPath 'P041-TEST-ERGEBNIS.txt' -Raw
            if ($nestedCode -ne 0) { throw "Renamed nested synthetic original media not discovered: $nestedCode" }
            if ($nestedLog -notmatch 'Vollstaendige Originalmedien in einem lokalen Testordner gefunden') {
                throw 'P041 renamed nested media not discovered by bounded directory search'
            }
            if ($nestedLog -notmatch 'P041 FINAL WINDOWS ORIGINAL FIRMWARE MATRIX: PASS') {
                throw 'P041 renamed nested media failed original harness argument forwarding'
            }
          } finally { Pop-Location }
          Write-Host 'P041 REAL WINDOWS CMD AUTO-LOCATION FAIL-CLOSED + SYNTHETIC ARGUMENT SMOKE: PASS (NO ORIGINAL ROM)'
          $global:LASTEXITCODE=0
